<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz Jev</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #18181b; } }
  #aviso-inicial {
    font: 13px/1.5 system-ui, sans-serif; color: #52525b; padding: 14px;
  }
  @media (prefers-color-scheme: dark) { #aviso-inicial { color: #a1a1aa; } }
</style>
</head>
<body>
<!-- O card em si é montado por quiz-render.js (mesmo visual do bookmarklet e
     da extensão: badges, barras, "Consultando" com bolinhas). Esta página
     não usa Shadow DOM — é a NOSSA página (GitHub Pages, sem CSP
     restritiva), então o CSS pode ir direto num <style> normal. -->
<div id="aviso-inicial">Abrindo…</div>
<div class="card" id="card" style="display:none"></div>

<script src="quiz-render.js"></script>
<script src="quiz-jev-direto.js"></script>
<script>
(function () {
  "use strict";

  var API = "https://api.santos-tech.com/quiz/answer";
  var card = document.getElementById("card");
  var avisoInicial = document.getElementById("aviso-inicial");

  // CSS compartilhado (mesmo do bookmarklet/extensão) + ajustes só desta
  // página: aqui o card é o conteúdo INTEIRO da janela (pequena, aberta via
  // window.open), não um overlay flutuante sobre uma página de terceiros.
  var style = document.createElement("style");
  style.textContent =
    QUIZ_JEV_CSS +
    "\n.card { position: static !important; max-width: 100% !important; " +
    "width: 100%; min-height: 100vh; box-sizing: border-box; margin: 0; " +
    "border: none; border-radius: 0; box-shadow: none; animation: none !important; }";
  document.head.appendChild(style);

  function mostrarCard() {
    avisoInicial.style.display = "none";
    card.style.display = "";
  }

  mostrarCard();
  quizJevMontarCarregando(card, "Consultando");

  var processado = false;

  // Formato esperado, mandado pelo bookmarklet via postMessage:
  // { raw: string, key: string, ask?: string, imageBase64?: string,
  //   imageMime?: string, imageUrl?: string, ponte?: true, id?: string }
  //
  // Dois modos:
  //   - ponte (ponte: true, id): o site da prova barra a API por CSP, então
  //     esta janela só faz o fetch no lugar dele, devolve o resultado ao
  //     opener ({type:"quizjev-resposta", id, ok, data|message}) — que
  //     mostra no card da própria página — e se fecha.
  //   - exibição (sem `ponte`): a resposta aparece aqui mesmo. É o que os
  //     favoritos instalados antes da ponte mandam, e o caso "sem card"
  //     do bookmarklet atual — precisa continuar funcionando.
  // Modo Jev: { key, jev: { url, corpo, opcoes, generico, precisaHeaderImagem } } —
  // o pedido já vem montado pelo bookmarklet (sem `raw`); a chave é a do Jev e o
  // destino é o proxy (Worker), só https e só o caminho /v1/systemone.
  function formatoJevValido(d) {
    var j = d.jev;
    if (!j || typeof j !== "object") return false;
    if (typeof j.url !== "string" || !/^https:\/\/[^\/]+\/v1\/systemone$/.test(j.url)) return false;
    if (!j.corpo || typeof j.corpo !== "object") return false;
    if (!j.opcoes || typeof j.opcoes !== "object") return false;
    return true;
  }

  function formatoValido(d) {
    if (!d || typeof d !== "object") return false;
    if (typeof d.key !== "string" || !d.key) return false;
    if (d.jev !== undefined) {
      if (d.ponte !== undefined && (d.ponte !== true || typeof d.id !== "string" || !d.id)) return false;
      return formatoJevValido(d);
    }
    if (typeof d.raw !== "string" || !d.raw) return false;
    if (d.ask !== undefined && typeof d.ask !== "string") return false;
    if (d.imageBase64 !== undefined && typeof d.imageBase64 !== "string") return false;
    if (d.imageUrl !== undefined && typeof d.imageUrl !== "string") return false;
    if (d.ponte !== undefined && (d.ponte !== true || typeof d.id !== "string" || !d.id)) return false;
    return true;
  }

  // Devolve o resultado da ponte para a origem que pediu (não "*": se o
  // opener tiver navegado pra outro site nesse meio-tempo, o navegador
  // descarta). Origem opaca ("null") não é destino válido — aí vai "*",
  // e o conteúdo é só a resposta, sem chave nenhuma.
  function responderAoOpener(origem, resposta) {
    if (!window.opener) return false;
    try {
      window.opener.postMessage(resposta, origem && origem !== "null" ? origem : "*");
      return true;
    } catch (e) {
      return false;
    }
  }

  function fecharEmBreve() {
    quizJevLimpar(card);
    card.appendChild(quizJevEl("div", "motivo", "Resposta enviada para a página da questão."));
    // Pequena folga pra mensagem sair antes da janela sumir.
    setTimeout(function () {
      window.close();
    }, 150);
  }

  // Consulta pelo proxy do Jev e já devolve a resposta no formato do card.
  function consultarJev(d) {
    var cabecalhos = { "Content-Type": "application/json", Authorization: "Bearer " + d.key };
    if (d.jev.precisaHeaderImagem) cabecalhos["TypeSafe-Danger-Zone-Images"] = "true";
    return fetch(d.jev.url, { method: "POST", headers: cabecalhos, body: JSON.stringify(d.jev.corpo) }).then(function (res) {
      return res
        .json()
        .catch(function () {
          return {};
        })
        .then(function (data) {
          if (!res.ok) throw new Error(quizJevMensagemHttpJev(res.status));
          return quizJevInterpretarRespostaJev(data, d.jev.opcoes, d.jev.generico, d.jev.julgamento);
        });
    });
  }

  function consultarApiGo(d) {
    var payload = { raw: d.raw };
    if (d.ask) payload.ask = d.ask;
    if (d.imageBase64) {
      payload.imageBase64 = d.imageBase64;
      payload.imageMime = d.imageMime || "image/png";
    } else if (d.imageUrl) {
      payload.imageUrl = d.imageUrl;
    }
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Quiz-Key": d.key },
      body: JSON.stringify(payload),
    }).then(function (res) {
      return res
        .json()
        .catch(function () {
          return {};
        })
        .then(function (data) {
          if (!res.ok) throw new Error((data && data.message) || "erro " + res.status);
          return data;
        });
    });
  }

  function processarMensagem(d, origem) {
    var comImagem = d.jev ? !!d.jev.precisaHeaderImagem : !!(d.imageBase64 || d.imageUrl);

    (d.jev ? consultarJev(d) : consultarApiGo(d))
      .then(function (data) {
        if (d.ponte && responderAoOpener(origem, { type: "quizjev-resposta", id: d.id, ok: true, data: data })) {
          fecharEmBreve();
          return;
        }
        quizJevLimpar(card);
        quizJevMontarResposta(card, data, comImagem, false);
      })
      .catch(function (e) {
        var mensagem = (e && e.message) || "falhou";
        if (d.ponte && responderAoOpener(origem, { type: "quizjev-resposta", id: d.id, ok: false, message: mensagem })) {
          fecharEmBreve();
          return;
        }
        quizJevLimpar(card);
        quizJevMontarErro(card, mensagem);
      });
  }

  window.addEventListener("message", function (ev) {
    // window.opener é quem abriu esta janela (o bookmarklet, rodando no
    // domínio variável do site da prova) — aceitamos qualquer origin (a
    // prova pode ser em qualquer domínio), mas só processamos mensagens do
    // opener e só se tiverem exatamente o formato esperado.
    if (ev.source !== window.opener) return;
    if (processado) return;
    if (!formatoValido(ev.data)) return;
    processado = true;
    clearInterval(repetidor);
    processarMensagem(ev.data, ev.origin);
  });

  // Handshake: avisa o opener que já está pronta pra receber — evita perder
  // a mensagem se o bookmarklet mandasse antes desta página carregar.
  // Repetido até a consulta chegar: custa nada, e cobre um opener que
  // registrou o listener um pouco depois de abrir a janela. Duplicatas são
  // ignoradas do lado de lá.
  var repetidor = null;
  function avisarPronta() {
    if (processado || !window.opener) return;
    try {
      window.opener.postMessage({ type: "quizjev-pronto" }, "*");
    } catch (e) {
      // opener sumiu — o timeout abaixo avisa
    }
  }
  if (window.opener) {
    avisarPronta();
    repetidor = setInterval(avisarPronta, 300);
  } else {
    quizJevLimpar(card);
    quizJevMontarErro(
      card,
      "Esta janela não consegue falar com a página de origem — ou foi aberta fora do favorito, ou o site isola as janelas que abre (COOP). Nesse caso, use o app do celular ou a extensão."
    );
  }

  // Se nada chegar em 20s (aba de origem fechada, favorito antigo etc.),
  // avisa em vez de deixar "Consultando" girando pra sempre.
  setTimeout(function () {
    clearInterval(repetidor);
    if (processado) return;
    quizJevLimpar(card);
    quizJevMontarErro(card, "Nada chegou da página de origem. Feche esta janela e clique no favorito de novo.");
  }, 20000);
})();
</script>
</body>
</html>
